<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferihelado 2026 Vértice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: portada oscura con seis paletas (una por marca) como firma; debajo, bloques tranquilos sobre papel hueso. Cada marca tiñe su propia página con su color. */
:root{
  --paper:#F5F2EB; --card:#FFFFFF; --ink:#1E2133; --muted:#666A7D; --line:#E3DFD4;
  --slate:#22263B; --on-slate:#F6F3EC; --accent:#D2392E; --accent-soft:#FBE4E0;
  --warn:#8A5A00; --warn-soft:#F8ECCB; --stick:#E2C08F;
  --display:"Unbounded","Arial Black",Arial,sans-serif; --body:"Hanken Grotesk","Segoe UI",Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(30,33,51,.06),0 8px 24px -12px rgba(30,33,51,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141621; --card:#1E2132; --ink:#EFECE4; --muted:#A4A7B8; --line:#32364C;
  --slate:#0E101A; --on-slate:#F6F3EC; --accent:#FF7A6E; --accent-soft:#47211E;
  --warn:#EDC265; --warn-soft:#3F3418; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#141621; --card:#1E2132; --ink:#EFECE4; --muted:#A4A7B8; --line:#32364C;
  --slate:#0E101A; --on-slate:#F6F3EC; --accent:#FF7A6E; --accent-soft:#47211E;
  --warn:#EDC265; --warn-soft:#3F3418; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h2{font-size:1.55rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:.92rem;font-weight:600}
h4{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
h4::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--brand,var(--accent))}
p{margin:0}
ul,ol{margin:0;padding-left:1.15em}
li+li{margin-top:.3em}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;height:auto;display:block}

header{background:var(--slate);color:var(--on-slate);position:sticky;top:0;z-index:5}
.bar{max-width:1140px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.bar h1 b{color:#FF8076}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-radius:999px;color:var(--on-slate);opacity:.75;padding:7px 15px;font-weight:600;font-size:.92rem;white-space:nowrap;transition:background .15s}
nav button:hover{opacity:1;background:rgba(255,255,255,.1)}
nav button[aria-selected="true"]{opacity:1;background:var(--on-slate);color:#22263B}

main{max-width:1140px;margin:0 auto;padding:22px 16px 70px}
section.tab{display:flex;flex-direction:column;gap:18px}
.lead{color:var(--muted);max-width:66ch;font-size:1.04rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.small{font-size:.87rem;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.15}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.74rem;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.chip.ws{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.cata{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .chip.cata{color:#1b1010}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.cata{color:#1b1010}}
.chip.ext{color:var(--muted);border-style:dashed}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.warnbox{background:var(--warn-soft);border-color:transparent;box-shadow:none}
.warnbox h3{color:var(--warn)}
.quote{border-left:3px solid var(--brand,var(--accent));padding:2px 0 2px 12px;font-style:italic}

/* Portada */
.hero{background:var(--slate);color:var(--on-slate);border-radius:24px;padding:34px clamp(20px,4vw,44px) 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 40px;align-items:end;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto -60px -120px auto;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(210,57,46,.35),transparent 68%);pointer-events:none}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.7}
.mega{font-size:clamp(2.1rem,7vw,4.3rem);font-weight:800;letter-spacing:-.035em;line-height:.95;margin:10px 0 14px;overflow-wrap:anywhere}
.mega em{font-style:normal;color:#FF8076}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-meta span{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 13px;font-size:.86rem}
.hero-meta span.hot{background:#FF8076;border-color:#FF8076;color:#22263B;font-weight:700}
.pops{display:flex;gap:12px;align-items:flex-end;position:relative}
.pop{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .2s;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
.pop:nth-child(2){animation-delay:.05s}.pop:nth-child(3){animation-delay:.1s}.pop:nth-child(4){animation-delay:.15s}.pop:nth-child(5){animation-delay:.2s}.pop:nth-child(6){animation-delay:.25s}
.pop:hover{transform:translateY(-6px)}
.pop i{display:block;width:50px;border-radius:25px 25px 9px 9px;border:2px solid rgba(255,255,255,.28);position:relative}
.pop i::after{content:"";position:absolute;left:9px;top:9px;width:7px;height:42%;border-radius:4px;background:rgba(255,255,255,.28)}
.pop u{display:block;width:10px;height:24px;background:var(--stick);border-radius:0 0 5px 5px}
.pop span{font-size:.66rem;font-weight:700;margin-top:7px;max-width:62px;text-align:center;line-height:1.15;color:var(--on-slate);opacity:.85}
@keyframes rise{from{transform:translateY(26px)}}
@media (max-width:760px){.hero{grid-template-columns:1fr}.pops{justify-content:space-between;gap:6px}.pop i{width:40px}}

.next{border:0;background:var(--accent);color:#fff;box-shadow:none}
.next .small{color:rgba(255,255,255,.85)}
.next .chip{background:#fff;color:var(--accent);border-color:#fff}
:root[data-theme="dark"] .next{color:#1b1010}:root[data-theme="dark"] .next .small{color:rgba(27,16,16,.8)}:root[data-theme="dark"] .next .chip{background:#1b1010;border-color:#1b1010}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{color:#1b1010}:root:not([data-theme="light"]) .next .small{color:rgba(27,16,16,.8)}:root:not([data-theme="light"]) .next .chip{background:#1b1010;border-color:#1b1010}}

.tile{border:0;border-radius:18px;padding:18px 18px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;justify-content:flex-end;transition:transform .2s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px)}
.tile h3{font-size:1rem}
.tile span{font-size:.85rem;opacity:.85}
.tile::after{content:"→";position:absolute;top:14px;right:16px;font-weight:700;opacity:.7}

/* Agenda */
.days{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
.day{display:flex;flex-direction:column;gap:10px;min-width:0}
.dayh{display:flex;align-items:center;gap:12px;padding:4px 2px 8px;border-bottom:3px solid var(--ink)}
.dnum{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.04em}
.dayh b{display:block;font-family:var(--display);font-size:.9rem}
.ev{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow)}
.ev.cata{border-left-color:var(--accent)}
.ev.ext{background:none;border-style:dashed;border-left-style:dashed;border-left-color:var(--line);box-shadow:none;color:var(--muted)}
.ev.now{outline:2px solid var(--accent)}
.evt{font-family:var(--display);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ev p{font-weight:600;line-height:1.35}
.ev.ext p{font-weight:500}
.combo{counter-reset:c;list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.combo li{counter-increment:c;display:flex;gap:12px;align-items:baseline;margin:0;padding:8px 0;border-bottom:1px dashed var(--line)}
.combo li:last-child{border:0}
.combo li::before{content:counter(c);font-family:var(--display);font-weight:800;color:var(--accent);min-width:1.2em}

/* Marcas */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0;border:1px solid rgba(128,128,128,.4)}
.banner{border-radius:22px;padding:30px clamp(20px,4vw,40px);display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden}
.banner h2{font-size:clamp(1.5rem,5vw,2.7rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.banner p{margin-top:10px;opacity:.88;max-width:48ch}
.banner .pop{animation:none;pointer-events:none;flex:none}
.banner .pop i{width:62px;height:104px!important;border-color:currentColor;opacity:.9}
.gal{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gal figure{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#EEECE6}
.gal figcaption{background:var(--card);padding:8px 12px;font-size:.84rem;color:var(--muted)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.t{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
tr.tot td{font-weight:700;background:color-mix(in srgb,var(--line) 40%,transparent)}

details{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
summary{cursor:pointer;padding:14px 18px;font-family:var(--display);font-weight:600;font-size:.88rem}
details>div{padding:2px 18px 18px;display:flex;flex-direction:column;gap:12px}
details .card,details .tw{box-shadow:none}
input[type=search]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;width:100%;max-width:360px}
.flav{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.flav div{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;display:flex;gap:10px;align-items:baseline;font-weight:500}
.flav b{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--accent);font-size:.7rem}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0;box-shadow:var(--shadow)}
.steps li::before{content:counter(s);display:block;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--brand,var(--accent));line-height:1;margin-bottom:8px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-r{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;font-size:.9rem}
.bar-t{display:flex;height:18px;border-radius:9px;overflow:hidden}
.bar-t i{display:block;background:var(--ink)}
.bar-t i+i{background:var(--accent)}
@media (max-width:480px){.bar-r{grid-template-columns:100px 1fr 26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Grupo Vértice: identidad sobria, editorial y corporativa */
:root{--slate:#152638;--accent:#A9B86A;--accent-soft:#EEF1E4;--on-slate:#F7F7F2;--warn:#8A5A00;--warn-soft:#F8ECCB}
:root[data-theme="dark"]{--slate:#101C29;--accent:#C2D18A;--accent-soft:#303A2C}
.brandmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;min-width:180px}
.brandmark-symbol{width:34px;height:34px;border:1px solid rgba(255,255,255,.45);border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:-.08em}
.brandmark-copy{display:flex;flex-direction:column;line-height:1.05}
.brandmark-copy strong{font-family:var(--display);font-size:.76rem;letter-spacing:.13em}
.brandmark-copy span{font-size:.58rem;letter-spacing:.18em;opacity:.7;margin-top:4px}
header .bar h1{display:none}
header .bar{padding-top:12px;padding-bottom:12px}
nav button[aria-selected="true"]{background:#F7F7F2;color:#152638}
.hero{background:#152638}
.hero::before{background:radial-gradient(circle,rgba(169,184,106,.28),transparent 68%)}
.mega em{color:#C5D28F}
.hero-meta span.hot{background:#C5D28F;border-color:#C5D28F;color:#152638}
.tile:focus-visible{outline-color:var(--accent)}
/* Control del evento */
.control-hero{background:#152638;color:#F7F7F2;border-radius:20px;padding:24px;display:grid;gap:16px}
.control-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{font:700 1.55rem var(--display);display:block;line-height:1.2}
.kpi span{font-size:.78rem;color:var(--muted)}
.control-tabs{display:flex;gap:6px;overflow:auto;padding:3px 0 8px}
.control-tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.86rem}
.control-tabs button[aria-pressed="true"]{background:var(--slate);color:#fff;border-color:var(--slate)}
.control-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.control-tools input,.control-tools select,.control-select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.control-tools input{flex:1;min-width:190px}
.status-select{font:inherit;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:6px 8px;min-width:118px}
.state{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:.73rem;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.state.pending{background:#F8ECCB;color:#795100}.state.progress{background:#DDEAF5;color:#1D557A}.state.done{background:#E5F1E5;color:#2E6537}.state.delayed{background:#FBE4E0;color:#9A3028}
.task-list{display:flex;flex-direction:column;gap:9px}
.task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}
.task-row h4{margin:0 0 5px;color:var(--ink);font:700 .9rem var(--body);letter-spacing:0;text-transform:none}
.task-row h4:before{display:none}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.task-side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.timeline{display:flex;flex-direction:column;gap:8px}
.timeline-row{display:grid;grid-template-columns:115px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.timeline-time{font-family:var(--display);font-size:.82rem;font-weight:700;color:var(--accent)}
.timeline-row p{font-weight:600;line-height:1.35}
.timeline-row .small{font-weight:400;margin-top:4px}
.contact-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.contact-row:last-child{border:0}
.progress-track{height:9px;border-radius:20px;background:var(--line);overflow:hidden}
.progress-track i{height:100%;display:block;background:var(--accent);border-radius:20px}
.notice{padding:13px 15px;border-radius:12px;background:#F8ECCB;color:#684B0C;font-size:.86rem}
.btn-quiet{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700}
@media(max-width:600px){.task-row{grid-template-columns:1fr}.task-side{align-items:flex-start}.timeline-row{grid-template-columns:85px minmax(0,1fr)}.brandmark{min-width:auto}}


/* Pantalla de aviso previa al dashboard */
.access-screen{position:fixed;inset:0;z-index:1000;background:rgba(14,28,41,.94);display:grid;place-items:center;padding:22px}
.access-card{width:min(560px,100%);background:#F7F7F2;color:#152638;border-radius:22px;padding:clamp(24px,5vw,42px);box-shadow:0 24px 80px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:18px;text-align:left}
.access-mark{font:800 .8rem var(--display);letter-spacing:.18em;color:#53633A}
.access-card h2{font-size:clamp(1.25rem,4vw,1.8rem);line-height:1.2}
.access-card p{font-size:1rem;line-height:1.55}
.access-card button{align-self:flex-start;border:0;border-radius:999px;background:#152638;color:#fff;padding:12px 22px;font-weight:700}
body.access-locked{overflow:hidden}body.access-locked>header,body.access-locked>main{visibility:hidden}

</style>
</head>
<body class="access-locked">
<div class="access-screen" id="accessScreen" role="dialog" aria-modal="true" aria-labelledby="accessTitle">
 <div class="access-card">
  <div class="access-mark">VÉRTICE · FERIHELADO 2026</div>
  <h2 id="accessTitle">Antes de abrir el dashboard</h2>
  <p>Los cambios de estado de las tareas se guardan actualmente en el navegador de cada persona, no se sincronizan con otros usuarios.</p>
  <button type="button" id="accessContinue">Entendido, abrir dashboard</button>
 </div>
</div>

<header>
  <div class="bar"><a class="brandmark" href="#inicio" aria-label="Grupo Vértice, inicio"><span class="brandmark-symbol">V</span><span class="brandmark-copy"><strong>VÉRTICE</strong><span>GRUPO EMPRESARIAL</span></span></a><nav role="tablist" id="nav"></nav></div>
</header>
<main id="main"></main>

<script>
const $=(s,r=document)=>r.querySelector(s);
const li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const tbl=(head,rows,cls=[])=>`<div class="tw"><table><thead><tr>${head.map((h,i)=>`<th class="${cls[i]||''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.c||''}">${(r.d||r).map((c,i)=>`<td class="${cls[i]||''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const card=(t,b,x='')=>`<div class="card ${x}">${t?`<h3>${t}</h3>`:''}${b}</div>`;
const det=(t,b,open)=>`<details ${open?'open':''}><summary>${t}</summary><div>${b}</div></details>`;

/* ---------- AGENDA ---------- */
const DAYS=[
 {id:'vie',d:20,name:'Viernes 20',feria:'10:00 a. m. a 8:00 p. m.'},
 {id:'sab',d:21,name:'Sábado 21',feria:'10:00 a. m. a 8:00 p. m.'},
 {id:'dom',d:22,name:'Domingo 22',feria:'10:00 a. m. a 7:00 p. m.'}];

function dayCol(d,all){
  const now=Date.now();
  const evs=EV.filter(e=>e.day===d.id&&(all||e.own)).map(e=>{
    const st=when(e.day,e.s),en=e.e?when(e.day,e.e):st+45*6e4,kind=e.type==='Cata'?'cata':'ws';
    const meta=[e.who?`Ponente: ${e.who}`:'',e.mise?`Mise en place ${e.mise}`:'',e.logos?`Logos: ${e.logos}`:''].filter(Boolean).join(' · ');
    return `<article class="ev ${e.own?kind:'ext'} ${now>=st&&now<en?'now':''}"><div class="evt"><span>${span(e)}</span><span class="chip ${e.own?kind:'ext'}">${e.type}${e.own?'':' · otra marca'}</span></div><p>${e.t}</p>${meta?`<span class="small">${meta}</span>`:''}</article>`;}).join('');
  const [dw,dn]=d.name.split(' ');
  return `<div class="day"><div class="dayh"><span class="dnum">${dn}</span><div><b>${dw}</b><span class="small">Feria de ${d.feria}</span></div></div>${evs}</div>`;
}
function countdown(){
  const now=Date.now(),open=when('vie',[10,0]),close=when('dom',[19,0]);
  if(now>close)return 'Feria finalizada';if(now>=open)return 'Feria en curso';
  const d=Math.ceil((open-now)/864e5);return d===1?'Falta 1 día':`Faltan ${d} días`;
}
function nextCard(){
  const now=Date.now(),own=EV.filter(e=>e.own).map(e=>({...e,st:when(e.day,e.s)})).sort((a,b)=>a.st-b.st);
  const open=when('vie',[10,0]),close=when('dom',[19,0]);
  const nx=own.find(e=>e.st>now);
  if(now>close)return card('La feria terminó','<p>Toca recap, seguimiento a contactos y balance de resultados por marca.</p>','next');
  const days=Math.ceil((open-now)/864e5);
  const head=now<open?`<p class="small">Faltan ${days} día${days===1?'':'s'} para abrir · viernes 20, 10:00 a. m.</p>`:'<p class="small">Feria en curso</p>';
  const dn=DAYS.find(d=>d.id===nx.day).name;
  return card('Próxima actividad nuestra',`${head}<p class="big">${dn} · ${span(nx)}</p><p><span class="chip ${nx.type==='Cata'?'cata':'ws'}">${nx.type}</span> ${nx.t}${nx.who?` · ${nx.who}`:''}</p>`,'next');
}

  ${card('Las 3 familias de producto',li(['<b>Bases:</b> el “cuerpo” del helado. Polvos que dan textura, cremosidad y estructura; se mezclan con agua, leche o base blanca. Las Soft-Ice: 2 kg de producto + 4 L de agua.','<b>Variegatos:</b> cremas y salsas para vetear helado y rellenar semifríos, tortas y pasteles. Cookies® Caramel y Lemon Meringue: 80 g por 1 kg de base blanca, o directo como variegato.','<b>Pastas:</b> el “sabor”. Concentradas, se añaden a la base para crear cada gusto.'])+'<p class="small">Misión: impulsar y capacitar a emprendedores y dueños de gelaterías, pizzerías y panaderías. Hay escuela y laboratorio. El catálogo no trae precios: se toman los datos y se pasan a ventas.</p>')}
  ${card('1 · Enganche con degustación',li(['“¡Hola! ¿Quieres probar un helado con ingredientes italianos? Este es de pistacho 100% puro.”','“Prueba este… es avellana y cacao con trocitos de wafer. Dime si no te recuerda a algo.”','“¿Te gusta el pistacho? Tengo que darte a probar el Baklava Pistachio Cream.”','“¿Dulce o frutal? Escoge y te doy a probar.”','“Este helado está hecho con nuestra base y nuestras pastas. ¿Tú haces helado o postres?”']))}
  ${card('2 · Preguntas',li(['“¿Tienes heladería, pastelería, panadería o pizzería? ¿O estás empezando?”','“¿Haces helado artesanal de bacha o soft (de máquina de cono)?”','“¿Cuáles son tus sabores más vendidos?”','“¿Tienes clientes que piden opciones con edulcorantes o sin azúcar añadida?”','“¿Qué usas hoy como base? ¿Te da la textura que quieres?”']))}

const CONTROL_KEY='vertice-ferihelado-control-v1';
function savedControl(){
 try{return JSON.parse(localStorage.getItem(CONTROL_KEY)||'{}')}catch(e){return {}}
}
function taskStatus(t){
 const saved=savedControl();return saved[t.id]||t.status;
}
function setTaskStatus(id,status){
 const saved=savedControl();saved[id]=status;localStorage.setItem(CONTROL_KEY,JSON.stringify(saved));
}
function stateClass(s){return s==='Listo'?'done':s==='En curso'?'progress':s==='Retrasado'?'delayed':'pending'}
function controlOverview(){
 const ts=CONTROL_DATA.tasks.map(t=>({...t,status:taskStatus(t)}));
 const done=ts.filter(t=>t.status==='Listo').length, pending=ts.filter(t=>t.status==='Pendiente').length, progress=ts.filter(t=>t.status==='En curso').length, late=ts.filter(t=>t.status==='Retrasado').length;
 const pct=Math.round(done/Math.max(1,ts.length)*100);
 return `
 <div class="control-hero"><p class="eyebrow">Grupo Vértice · Ferihelado 2026</p><h2>Control operativo</h2><p>Seguimiento de tareas, montaje, turnos y ejecución diaria desde un solo lugar.</p>
 <div class="control-kpis">
  <div class="kpi"><b>${ts.length}</b><span>Tareas registradas</span></div>
  <div class="kpi"><b>${done}</b><span>Listas</span></div>
  <div class="kpi"><b>${pending}</b><span>Pendientes</span></div>
  <div class="kpi"><b>${progress+late}</b><span>En curso / retrasadas</span></div>
 </div>
 <div><div class="row" style="justify-content:space-between"><span class="small" style="color:#F7F7F2">Avance global de tareas</span><b>${pct}%</b></div><div class="progress-track"><i style="width:${pct}%"></i></div></div></div>
 <div class="notice"><b>Horario y montaje confirmados por coordinación:</b> la feria inicia a las 10:00 a. m. y el montaje se realizará el martes 17/11. Se actualizó el cronograma de montaje con esta fecha.</div>
 <div class="grid g2">
  ${card('Avance por área',CONTROL_DATA.areas.filter(a=>a.area!=='Total').map(a=>`<div class="stack"><div class="row" style="justify-content:space-between"><b>${a.area}</b><span class="small">${a.done}/${a.tasks} · ${a.progress}%</span></div><div class="progress-track"><i style="width:${a.progress}%"></i></div></div>`).join(''))}
  ${card('Próximos hitos',`<div class="stack">${CONTROL_DATA.mount.slice(0,6).map(m=>`<div class="contact-row"><div><b>${m.task}</b><div class="small">${m.day} · ${m.owner}</div></div><span class="state ${stateClass(m.status)}">${m.status}</span></div>`).join('')}</div>`)}
 </div>
 <div class="row"><button class="btn-quiet" data-ctab="tareas">Abrir control de tareas →</button><button class="btn-quiet" data-ctab="montaje">Ver montaje →</button><button class="btn-quiet" data-ctab="turnos">Ver turnos →</button></div>`;
}
function controlTasks(){
 const q=S.taskQ.toLowerCase();
 const ts=CONTROL_DATA.tasks.map(t=>({...t,status:taskStatus(t)})).filter(t=>(S.taskStatus==='Todos'||t.status===S.taskStatus)&&(S.taskArea==='Todas'||t.area===S.taskArea)&&(!q||[t.task,t.area,t.brand,t.owner,t.notes].join(' ').toLowerCase().includes(q)));
 const areas=[...new Set(CONTROL_DATA.tasks.map(t=>t.area))].sort();
 return `<div class="control-tools"><input id="taskq" type="search" placeholder="Buscar tarea, responsable o marca…" value="${S.taskQ}"><select id="taskarea"><option>Todas</option>${areas.map(a=>`<option ${S.taskArea===a?'selected':''}>${a}</option>`).join('')}</select><select id="taskstatus">${['Todos','Pendiente','En curso','Listo','Retrasado','Cancelado'].map(s=>`<option ${S.taskStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>
 <p class="small">${ts.length} de ${CONTROL_DATA.tasks.length} tareas · Cambia el estado desde cada tarjeta. Los cambios se guardan en este navegador.</p>
 <div class="task-list">${ts.map(t=>`<article class="task-row"><div><h4>${t.id}. ${t.task}</h4><div class="task-meta"><span>${t.area}</span><span>· ${t.brand}</span><span>· Responsable: ${t.owner}</span><span>· Límite: ${t.due||'Sin fecha'}</span><span>· Prioridad: ${t.priority}</span></div>${t.notes?`<p class="small" style="margin-top:6px">${t.notes}</p>`:''}</div><div class="task-side"><span class="state ${stateClass(t.status)}">${t.status}</span><select class="status-select" data-task-status="${t.id}" aria-label="Estado de tarea ${t.id}">${['Pendiente','En curso','Listo','Retrasado','Cancelado'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div></article>`).join('')||'<p class="small">No hay tareas que coincidan con estos filtros.</p>'}</div>`;
}
function controlMount(){
 const rows=CONTROL_DATA.mount.filter(m=>S.mountStatus==='Todos'||m.status===S.mountStatus);
 const phases=[...new Set(CONTROL_DATA.mount.map(m=>m.phase))];
 return `<div class="control-tools"><select id="mountstatus"><option>Todos</option>${['Pendiente','En curso','Listo','Retrasado'].map(s=>`<option ${S.mountStatus===s?'selected':''}>${s}</option>`).join('')}</select><span class="small">${rows.length} actividades de montaje, desmontaje y pre/post evento</span></div>
 ${phases.map(ph=>`<h3>${ph}</h3><div class="timeline">${rows.filter(m=>m.phase===ph).map(m=>`<div class="timeline-row"><div class="timeline-time">${m.day}<br>${m.start}–${m.end}</div><div><p>${m.task}</p><div class="small">${m.owner}${m.resources?' · '+m.resources:''}</div><div class="row" style="margin-top:6px"><span class="state ${stateClass(m.status)}">${m.status}</span>${m.notes?`<span class="small">${m.notes}</span>`:''}</div></div></div>`).join('')||'<p class="small">Sin actividades para este filtro.</p>'}</div>`).join('')}`;
}
function controlDaily(){
 return `<p class="lead">Rutina diaria propuesta para viernes 20, sábado 21 y domingo 22. La feria inicia a las 10:00 a. m. de viernes a domingo. Los cierres se mantienen según el cronograma de cada día.</p><div class="timeline">${CONTROL_DATA.daily.map(d=>`<div class="timeline-row"><div class="timeline-time">${d.start}${d.end&&d.end!==d.start?'–'+d.end:''}</div><div><p>${d.task}</p><div class="small">${d.owner}${d.verify?' · Verificación: '+d.verify:''}</div></div></div>`).join('')}</div><h3>Variaciones por día</h3><div class="grid g3">${card('Viernes 20','<p>Día 1: Turno A llega 07:30 para primer montaje de producto. Verificar que todo lo probado el jueves funciona. Registrar afluencia por hora para ajustar sábado.</p>')}${card('Sábado 21','<p>Día de mayor afluencia esperada: reforzar con 1 persona extra en stand 03 y en feria de comida entre 13:00 y 19:00. Producción de reposición mayor.</p>')}${card('Domingo 22','<p>Reducir producción de reposición al 70 % del sábado. Turno B inicia desmontaje a las 20:00 según hoja Montaje-Desmontaje. Todo el equipo permanece hasta 22:30.</p>')}</div>`;
}
function controlShifts(){
 const days=['Vie 20/11','Sáb 21/11','Dom 22/11'];
 return `<div class="notice">Se muestran las asignaciones que aparecen en el Excel. Los campos de horario que no tienen dato se conservan como “Por definir”. El domingo queda “Por definir” porque no hay asignaciones nominales cargadas.</div>${days.map(day=>{
 const rows=CONTROL_DATA.shifts.filter(x=>x.day===day);
 if(day==='Dom 22/11') return `<h3>${day}</h3><div class="card"><b>Turnos del domingo</b><p class="small">Por definir</p></div>`;
 return `<h3>${day}</h3>${tbl(['Nombre','Rol','Espacio','Marca','Entrada','Salida','Break / observación'],rows.map(x=>[x.name,x.role,x.space,x.brand,x.start||'Por definir',x.end||'Por definir',x.breaks||'—']))}`;
 }).join('')}`;
}
function controlContacts(){
 return `<div class="notice">Directorio resumido. Los teléfonos y correos del Excel se omiten en esta versión de revisión para evitar exponer datos de contacto al compartir un enlace abierto.</div><div class="card">${CONTROL_DATA.contacts.map(c=>`<div class="contact-row"><div><b>${c.name}</b><div class="small">${c.role}</div></div>${c.notes?`<span class="small">${c.notes}</span>`:''}</div>`).join('')}</div>`;
}
function controlRender(){
 const tabs=[['resumen','Resumen'],['tareas','Pendientes'],['montaje','Montaje'],['diario','Día a día'],['turnos','Turnos'],['contactos','Contactos']];
 const body={resumen:controlOverview,tareas:controlTasks,montaje:controlMount,diario:controlDaily,turnos:controlShifts,contactos:controlContacts};
 return `<h2>Control del evento</h2><p class="lead">Tablero operativo basado en el Excel “FeriHelado 2026 · Control del evento”.</p><div class="control-tabs">${tabs.map(([id,n])=>`<button data-ctab="${id}" aria-pressed="${S.controlTab===id}">${n}</button>`).join('')}</div>${body[S.controlTab]()}`;
}

function fill(){
  const f=$('#flav');if(f){const q=S.vq.toLowerCase();const r=VITRINA.map((v,i)=>[i+1,v]).filter(([,v])=>v.toLowerCase().includes(q));f.innerHTML=r.length?r.map(([i,v])=>`<div><b>${String(i).padStart(2,'0')}</b>${v}</div>`).join(''):'<p class="small">Ningún sabor coincide.</p>';}
  const o=$('#objt');if(o){const q=S.objq.toLowerCase();const r=OBJ.filter(x=>x.join(' ').toLowerCase().includes(q));o.innerHTML=r.length?tbl(['Marca','El cliente dice…','Tú respondes…'],r.map(x=>[`<span class="chip">${x[0]}</span>`,x[1],x[2]])):'<p class="small">Ninguna objeción coincide.</p>';}
}
function render(){
  $('#nav').innerHTML=TABS.map(([id,n])=>`<button role="tab" data-tab="${id}" aria-selected="${S.tab===id}">${n}</button>`).join('');
  $('#main').innerHTML=`<section class="tab on">${T[S.tab]()}</section>`;fill();
}
function go(tab){S.tab=tab;if(location.hash!=='#'+tab)location.hash=tab;else render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab)go(b.dataset.tab);
  else if(b.dataset.ctab){S.controlTab=b.dataset.ctab;render();}
  else if(b.dataset.day){S.day=b.dataset.day;render();}
  else if(b.dataset.brand){S.brand=b.dataset.brand;if(S.tab!=='marcas')go('marcas');else render();}
});
document.addEventListener('change',e=>{
 if(e.target.id==='extchk'){S.ext=e.target.checked;render();}
 if(e.target.id==='taskstatus'){S.taskStatus=e.target.value;render();}
 if(e.target.id==='taskarea'){S.taskArea=e.target.value;render();}
 if(e.target.id==='mountstatus'){S.mountStatus=e.target.value;render();}
 if(e.target.matches('[data-task-status]')){setTaskStatus(e.target.dataset.taskStatus,e.target.value);render();}
});
document.addEventListener('input',e=>{if(e.target.id==='vq'){S.vq=e.target.value;fill();}if(e.target.id==='objq'){S.objq=e.target.value;fill();}if(e.target.id==='taskq'){S.taskQ=e.target.value;const pos=e.target.selectionStart;render();const n=$('#taskq');if(n){n.focus();n.setSelectionRange(pos,pos);}}});
function fromHash(){const h=location.hash.slice(1);S.tab=T[h]?h:'inicio';render();}
window.addEventListener('hashchange',fromHash);fromHash();
$('#accessContinue').addEventListener('click',()=>{ $('#accessScreen').remove(); document.body.classList.remove('access-locked'); });
</script>
</body>
</html>
